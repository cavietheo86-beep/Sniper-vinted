name: Sniper Vinted

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sniper
  cancel-in-progress: false

jobs:
  sniper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Chercher les nouvelles annonces
        run: python vinted_bot.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

      - name: Sauvegarder les annonces déjà vues
        run: |
          git config user.name "sniper-bot"
          git config user.email "sniper-bot@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || (git commit -m "maj annonces vues" && git pull --rebase && git push)
